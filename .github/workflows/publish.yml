name: publish
run-name: "${{ format('release {0}', inputs.version) }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 0.0.3)"
        required: true
        type: string
      create_release:
        description: "Create GitHub Release"
        required: false
        type: boolean
        default: true

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  build-cli:
    runs-on: ubuntu-latest
    if: github.repository == 'yuji8023/slmapcode'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - name: Build
        id: build
        run: ./packages/opencode/script/build.ts
        env:
          SLMAPCODE_CHANNEL: latest
          SLMAPCODE_VERSION: ${{ inputs.version }}
          SLMAPCODE_RELEASE: true
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        with:
          name: slmapcode-cli
          path: packages/opencode/dist

  publish:
    needs: build-cli
    runs-on: ubuntu-latest
    if: github.repository == 'yuji8023/slmapcode'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Git Identity
        run: |
          git config --global user.email "yuji_hu@163.com"
          git config --global user.name "yuji"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}

      - uses: actions/download-artifact@v4
        with:
          name: slmapcode-cli
          path: packages/opencode/dist

      - name: Publish to npm
        id: publish
        run: ./script/publish.ts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          SLMAPCODE_VERSION: ${{ inputs.version }}
          SLMAPCODE_CHANNEL: latest
          SLMAPCODE_API_KEY: ${{ secrets.SLMAPCODE_API_KEY }}
          NPM_CONFIG_PROVENANCE: false
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: inputs.create_release == true
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --notes "Release v${{ inputs.version }}" \
            packages/opencode/dist/*.tar.gz \
            packages/opencode/dist/*.zip || echo "Release already exists"
        env:
          GH_TOKEN: ${{ github.token }}

    outputs:
      version: ${{ inputs.version }}
