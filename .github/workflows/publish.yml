name: publish
run-name: "${{ format('release {0}', inputs.bump) }}"

on:
  push:
    branches:
      - feature-slmap-code
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Override version (optional)"
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || inputs.bump }}

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'yuji8023/slmapcode'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - run: git fetch --force --tags

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Git Identity
        run: |
          git config --global user.email "yuji_hu@163.com"
          git config --global user.name "yuji"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}

      - name: Publish
        id: publish
        run: ./script/publish-start.ts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          SLMAPCODE_BUMP: ${{ inputs.bump }}
          SLMAPCODE_VERSION: ${{ inputs.version }}
          SLMAPCODE_API_KEY: ${{ secrets.SLMAPCODE_API_KEY }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
          NPM_CONFIG_PROVENANCE: false
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: slmapcode-cli
          path: packages/opencode/dist

    outputs:
      release: ${{ steps.publish.outputs.release }}
      tag: ${{ steps.publish.outputs.tag }}
      version: ${{ steps.publish.outputs.version }}

  publish-release:
    needs:
      - publish
    if: needs.publish.outputs.tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ needs.publish.outputs.tag }}

      - uses: ./.github/actions/setup-bun

      - name: Setup SSH for AUR
        run: |
          sudo apt-get update
          sudo apt-get install -y pacman-package-manager
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          git config --global user.email "yuji_hu@163.com"
          git config --global user.name "slmapcode"
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts || true

      - run: ./script/publish-complete.ts
        env:
          SLMAPCODE_VERSION: ${{ needs.publish.outputs.version  }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
