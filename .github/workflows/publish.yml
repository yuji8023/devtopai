name: publish
run-name: "${{ format('release {0}', inputs.bump) }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch (auto increment)"
        required: false
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Or specify exact version (e.g., 0.0.3)"
        required: false
        type: string
      create_release:
        description: "Create GitHub Release"
        required: false
        type: boolean
        default: true

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || inputs.bump }}

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'yuji8023/slmapcode'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Setup Git Identity
        run: |
          git config --global user.email "yuji_hu@163.com"
          git config --global user.name "yuji"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}

      - name: Update Version
        run: |
          # Update all package.json files with new version
          bun install
          bun -e "
          import { Glob } from 'bun';
          const version = process.env.VERSION;
          const glob = new Glob('**/package.json');
          const files = [];
          for await (const file of glob.scan({ cwd: '.', onlyFiles: true })) {
            if (file.includes('node_modules') || file.includes('dist')) continue;
            files.push(file);
          }
          for (const file of files) {
            const text = await Bun.file(file).text();
            const pkg = JSON.parse(text);
            pkg.version = version;
            await Bun.write(file, JSON.stringify(pkg, null, 2) + '\n');
            console.log('Updated:', file);
          }
          "
        env:
          VERSION: ${{ inputs.version || '0.0.2' }}
        if: inputs.version

      - name: Build CLI (All Platforms)
        run: ./packages/opencode/script/build.ts
        env:
          SLMAPCODE_CHANNEL: latest
          SLMAPCODE_BUMP: ${{ inputs.bump }}
          SLMAPCODE_VERSION: ${{ inputs.version }}
          SLMAPCODE_RELEASE: true
          GH_TOKEN: ${{ github.token }}

      - name: Get Version
        id: version
        run: |
          VERSION=$(bun -p "require('./packages/opencode/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create GitHub Release
        id: create_release
        if: inputs.create_release == true && (inputs.bump || inputs.version)
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes "Release v${{ steps.version.outputs.version }}" \
            --draft \
            packages/opencode/dist/*.tar.gz \
            packages/opencode/dist/*.zip
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish Release
        if: steps.create_release.outcome == 'success'
        run: |
          gh release edit "v${{ steps.version.outputs.version }}" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish to npm
        if: inputs.bump || inputs.version
        run: |
          # Create a temporary directory for publishing
          TEMP_DIR=$(mktemp -d)

          # Copy package files
          cp packages/opencode/package.json "$TEMP_DIR/"
          cp packages/opencode/README.md "$TEMP_DIR/" 2>/dev/null || echo "No README found"
          cp -r packages/opencode/bin "$TEMP_DIR/" 2>/dev/null || echo "No bin directory"
          cp -r packages/opencode/dist "$TEMP_DIR/" 2>/dev/null || echo "No dist directory"

          cd "$TEMP_DIR"

          # Remove private flag and workspace references
          bun -e "
          const pkg = JSON.parse(await Bun.file('package.json').text());
          delete pkg.private;
          delete pkg.workspaces;
          // Remove workspace dependencies
          if (pkg.dependencies) {
            for (const [key, value] of Object.entries(pkg.dependencies)) {
              if (typeof value === 'string' && value.startsWith('workspace:')) {
                delete pkg.dependencies[key];
              }
            }
          }
          if (pkg.devDependencies) {
            for (const [key, value] of Object.entries(pkg.devDependencies)) {
              if (typeof value === 'string' && value.startsWith('workspace:')) {
                delete pkg.devDependencies[key];
              }
            }
          }
          await Bun.write('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          # Publish to npm (requires NPM_TOKEN secret)
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            npm config set //registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}
            npm publish --access public
            echo "Published to npm successfully"
          else
            echo "NPM_TOKEN not set, skipping npm publish"
          fi

          # Cleanup
          cd -
          rm -rf "$TEMP_DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: slmapcode-cli
          path: packages/opencode/dist

    outputs:
      version: ${{ steps.version.outputs.version }}
