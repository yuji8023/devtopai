name: publish
run-name: "${{ format('release {0}', inputs.bump) }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch (auto increment)"
        required: false
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Or specify exact version (e.g., 0.0.3)"
        required: false
        type: string
      create_release:
        description: "Create GitHub Release"
        required: false
        type: boolean
        default: true

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || inputs.bump }}

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'yuji8023/slmapcode'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Setup Git Identity
        run: |
          git config --global user.email "yuji_hu@163.com"
          git config --global user.name "yuji"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}

      - name: Update Version
        run: |
          # Update all package.json files with new version
          bun install
          node -e "
          const fs = require('fs');
          const glob = require('glob');
          const version = process.env.VERSION;
          const files = glob.sync('**/package.json', { ignore: ['**/node_modules/**', '**/dist/**'] });
          files.forEach(file => {
            const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
            pkg.version = version;
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
            console.log('Updated:', file);
          });
          "
        env:
          VERSION: ${{ inputs.version || '0.0.2' }}
        if: inputs.version

      - name: Build CLI
        run: ./packages/opencode/script/build.ts --single
        env:
          SLMAPCODE_CHANNEL: latest
          SLMAPCODE_BUMP: ${{ inputs.bump }}
          SLMAPCODE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}

      - name: Get Version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/opencode/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Create GitHub Release
        if: inputs.create_release == true && (inputs.bump || inputs.version)
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes "Release v${{ steps.version.outputs.version }}" \
            --draft \
            packages/opencode/dist/*.tar.gz \
            packages/opencode/dist/*.zip || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish Release
        if: inputs.create_release == true && (inputs.bump || inputs.version)
        run: |
          gh release edit "v${{ steps.version.outputs.version }}" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@v4
        with:
          name: slmapcode-cli
          path: packages/opencode/dist

    outputs:
      version: ${{ steps.version.outputs.version }}
